name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 143.198.105.249
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/phone-system
            git fetch origin
            git reset --hard origin/main

            cd /opt/phone-system/server
            npm ci
            npm run build
            pm2 start dist/main.js --name phone-server || true
            pm2 restart phone-server
            pm2 save

            cd /opt/phone-system/client
            npm ci
            npm run build

            rm -rf /var/www/phone-system
            mkdir -p /var/www/phone-system
            cp -r /opt/phone-system/client/build/. /var/www/phone-system/

            # Ensure nginx allows file uploads for MMS attachments
            PHONE_NGINX=$(grep -rl 'phone\.giddydigs' /etc/nginx/sites-enabled/ 2>/dev/null | head -1)
            if [ -n "$PHONE_NGINX" ] && ! grep -q 'client_max_body_size' "$PHONE_NGINX"; then
              sed -i '/server_name/a\    client_max_body_size 10m;' "$PHONE_NGINX"
            fi

            nginx -t
            systemctl reload nginx
