name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 143.198.105.249
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /opt/phone-system
            git fetch origin
            git reset --hard origin/main

            cd /opt/phone-system/server
            npm ci
            npm run build
            pm2 start dist/main.js --name phone-server || true
            pm2 restart phone-server
            pm2 save

            cd /opt/phone-system/client
            npm ci
            npm run build

            rm -rf /var/www/phone-system
            mkdir -p /var/www/phone-system
            cp -r /opt/phone-system/client/build/. /var/www/phone-system/

            # Ensure nginx allows file uploads and serves uploaded media
            if ! grep -q 'client_max_body_size' /etc/nginx/sites-available/default; then
              sed -i '/server_name phone\.giddydigs\.com.*managed by Certbot/a\    client_max_body_size 10m;' /etc/nginx/sites-available/default
            fi
            if ! grep -q 'location /uploads/' /etc/nginx/sites-available/default; then
              sed -i '/location \/api\//i\    location /uploads/ {\n        proxy_pass http://127.0.0.1:3200;\n        proxy_set_header Host $host;\n    }\n' /etc/nginx/sites-available/default
            fi

            nginx -t
            systemctl reload nginx
